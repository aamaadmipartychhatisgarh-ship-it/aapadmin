services:
  mysql:
    # MariaDB, not MySQL: production (Hostinger) runs MariaDB 11.8, and its dumps
    # carry MariaDB-only collations (utf8mb4_uca1400_ai_ci) that MySQL 8 refuses
    # to import. Matching the production engine keeps a restored dump loadable and
    # local behaviour faithful.
    image: mariadb:11.8
    container_name: aapadmin_mysql
    restart: unless-stopped
    environment:
      # App defaults to an empty root password (see src/lib/db.js & SETUP.md)
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: aapadmin
    ports:
      - "3306:3306"
    volumes:
      - aapadmin_mysql_data:/var/lib/mysql
    healthcheck:
      # MariaDB 11 dropped the `mysqladmin` compatibility symlink — use the
      # image's own healthcheck helper instead.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aapadmin_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
      # allow logging in to a root account that has no password
      UPLOAD_LIMIT: 256M
    ports:
      # 8080 is used by another project on this machine, so use 8081
      - "8081:80"

volumes:
  aapadmin_mysql_data:
